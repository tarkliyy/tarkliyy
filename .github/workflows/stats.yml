name: refresh card

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: card
  cancel-in-progress: false

jobs:
  bikin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: build card
        run: node gen/bikin.mjs
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: push card
        run: bash gen/ship.sh
